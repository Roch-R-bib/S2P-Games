<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTOP Rocket</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main id="game-container">
    <section id="hud" aria-label="Game information">
      <div class="hud-item">
        Time:
        <span id="timer">10</span>s
      </div>

      <div class="hud-item">
        Boosts:
        <span id="score">0</span>
      </div>
    </section>

    <section id="instructions-panel" aria-label="Game instructions">
      <div class="instruction-title">
        PTOP Rocket Launch
      </div>

      <div class="instruction-main">
        Smash the <span class="key">SPACE</span> key
      </div>

      <div class="instruction-sub">
        Press SPACE repeatedly to boost the PTOP Rocket as high as possible!
      </div>
    </section>

    <section id="game" aria-label="Game area">
      <div id="world">
        <div id="cloud-layer"></div>
        <div id="space-layer"></div>
      </div>

      <div id="rocket-zone">
        <div id="rocket">
          <img
            id="rocket-sprite"
            src="images/ptop-rocket.png"
            alt="PTOP Rocket"
          />
          <div id="flame"></div>
        </div>
      </div>

      <div id="launch-pad">
        <div id="launcher"></div>
        <div id="earth"></div>
      </div>
    </section>

    <p id="message">
      Press SPACE repeatedly to launch the rocket!
    </p>

    <section id="game-over" aria-label="Game over">
      <h2>Mission Complete</h2>
      <div id="final-score"></div>
      <div id="final-rank"></div>
      <button id="restart-btn" type="button">
        Play Again
      </button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
